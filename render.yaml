services:
  # Backend API
  - type: web
    name: project-tracking-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL
        fromDatabase:
          name: project-tracking-db
          property: connectionString
  
  # Frontend
  - type: web
    name: project-tracking-frontend
    runtime: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npx serve -s build -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: 18

databases:
  - name: project-tracking-db
    databaseName: project_tracking
    user: projectuser
    plan: free